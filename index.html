<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>青ブタWALK</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f9bd1">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="青ブタWALK">

<style>
:root{--bg:#f6f9fc;--card:#fff;--ink:#1c2733;--sub:#5b6b7a;--line:#dbe4ec;--accent:#1f9bd1;--accent2:#e0457b;--ok:#2e9e6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--card:#18222c;--ink:#e8eef4;--sub:#9fb0c0;--line:#2a3846;--accent:#4cb8e8;--accent2:#f06a9a;--ok:#4cc790;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171e;--card:#18222c;--ink:#e8eef4;--sub:#9fb0c0;--line:#2a3846;--accent:#4cb8e8;--accent2:#f06a9a;--ok:#4cc790;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.lead{color:var(--sub);font-size:12px;margin:0 0 14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.lab{font-size:11px;color:var(--sub);margin:6px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.done{border-color:var(--ok)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;border-radius:6px;padding:1px 8px;color:#fff;background:var(--accent2)}
.tag.a{background:var(--accent)}
.card h2{font-size:16px;margin:8px 0 4px}
.card p{margin:0;font-size:14px}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px;font-size:13px;cursor:pointer;font-family:inherit}
.btn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.note{color:var(--sub);font-size:12px}
textarea{width:100%;height:90px;margin-top:8px;font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px}
footer{color:var(--sub);font-size:11px;margin-top:20px}
</style>
</head>
<body>
<main>
<h1>青ブタWALK</h1>
<p class="lead">作品名は『青春ブタ野郎は〇〇の夢を見ない』の〇〇部分です。アニメ・劇場版も原作と同じタイトルです。</p>
<div class="box"><div id="pt" style="font-size:14px"></div><div class="bar"><i id="pb"></i></div></div>
<div class="lab">作品で絞り込む</div>
<div class="chips" id="ct"></div>
<div class="lab">エリアで絞り込む</div>
<div class="chips" id="ca"></div>
<div id="route"></div>
<div id="list"></div>
<div class="box">
<b style="font-size:14px">Googleマイマップに取り込む</b>
<p class="note" style="margin:4px 0 8px">全スポットをCSVでコピーし、マイマップの「インポート」に使えます。保存した地図はスマホのGoogleマップにそのまま同期されます。</p>
<button class="btn main" style="width:100%" id="csv">CSVをコピー</button>
<textarea id="ta" hidden readonly></textarea>
</div>
<footer>非公式のファンメイドです。登場巻は原作ファンの聖地まとめ・観光サイトの公開情報をもとにしており、場所の特定には推定を含むものがあります。作品画像は使用していません。</footer>
</main>
<script>
var T=["バニーガール先輩","プチデビル後輩","ロジカルウィッチ","シスコンアイドル","おるすばん妹","ゆめみる少女","ハツコイ少女","ランドセルガール","サンタクロース"];
var A=[0,1,2,3,4,5,6];
var MODE={"藤沢":"walking","片瀬・江ノ島駅周辺":"walking","江の島":"walking","七里ヶ浜":"walking","鎌倉・逗子・葉山":"transit","鵠沼":"walking","横浜・東京":"transit","金沢・大垣":"transit"};
var CITY={"藤沢":"藤沢市","片瀬・江ノ島駅周辺":"藤沢市","江の島":"藤沢市","七里ヶ浜":"鎌倉市","鵠沼":"藤沢市"};
var S=[
["藤沢","藤沢駅",A.concat([8]),"咲太たちの通学・移動の拠点。大垣や横浜、金沢への旅の出発点。小田急線に乗り換えて通学する双葉も利用する駅(JR・江ノ電・小田急)。","藤沢駅 藤沢市"],
["藤沢","藤沢駅北口・サンパール広場",[0],"アニメのOPに登場した駅前の広場。","サンパール広場 藤沢市"],
["藤沢","ビックカメラ・ジュンク堂 藤沢店",[0,2],"ビックカメラは咲太の通学路にある家電量販店。同じ建物の上階のジュンク堂は、双葉と会った本屋。","ビックカメラ 藤沢店"],
["藤沢","デニーズ 藤沢北口店",A,"咲太・国見・朋絵のバイト先ファミレスのモデル。"],
["藤沢","御所ヶ谷公園",[0,3],"迷子の女の子が泣いていた公園。麻衣がダンスを見せた場所でもあります。"],
["藤沢","藤沢市民病院",[2,3,4,5,6],"咲太や翔子、かえでが入院する病院のモデルとされる。"],
["藤沢","藤沢市総合市民図書館",[0],"咲太がバニーガール姿の麻衣と出会う図書館。"],
["藤沢","藤沢市立藤が丘中学校",[4],"かえでが本来通うはずの中学校のモデル。"],
["片瀬・江ノ島駅周辺","片瀬江ノ島駅",[2,8],"龍宮城風の駅舎。花火の帰りに咲太・双葉・国見が歩く。"],
["片瀬・江ノ島駅周辺","江ノ電 江ノ島駅〜江の島への道",[1],"咲太と朋絵が微妙な距離で歩いた道。","江ノ島駅 藤沢市"],
["片瀬・江ノ島駅周辺","片瀬橋(国道134号)",[1],"朋絵と渡った境川の橋とされる。","片瀬橋 藤沢市"],
["片瀬・江ノ島駅周辺","新江ノ島水族館",[0,1],"朋絵とのデート先。麻衣が周囲に見えていないと気づく場面にも関わる。"],
["片瀬・江ノ島駅周辺","新江ノ島水族館前の横断歩道",[5],"劇場版で咲太が交差点へ向かう場面。","新江ノ島水族館 横断歩道"],
["片瀬・江ノ島駅周辺","江ノ島入口交差点",[5],"劇場版で描かれた事故の交差点。"],
["片瀬・江ノ島駅周辺","江ノ島入口交差点の地下道",[1],"本土から江の島へ向かう地下道。咲太と朋絵が最後のデートへ向かう。","江ノ島入口交差点 地下道"],
["片瀬・江ノ島駅周辺","片瀬海岸西浜",[2],"咲太・双葉・国見が花火をして夏祭りを見た海岸。"],
["江の島","江の島弁天橋",[1,5],"朋絵とのデートで通る橋。劇場版にも登場。"],
["江の島","江の島(島内)",[1,6],"朋絵が咲太との初デート先に選んだ島。麻衣と翔子もクリスマスデートの行き先にしようとする。","江の島 藤沢市"],
["江の島","江島神社 中津宮",[1],"朋絵と絵馬を結んだ場所。広場のウッドデッキからは湘南を一望できる。"],
["江の島","片瀬東浜海水浴場",[1],"海で遊んだあと朋絵と別れる場面の舞台。"],
["江の島","江の島大橋",[8],"江の島へ渡る橋。"],
["七里ヶ浜","七里ヶ浜駅",A.concat([8]),"咲太たちの学校の最寄り駅。盗撮から麻衣を守る、先輩と喧嘩するなど、巻ごとに印象的な場面の舞台。"],
["七里ヶ浜","七里ヶ浜駅横の踏切",[0],"登下校のシーンで何度も登場する踏切。","七里ヶ浜駅 踏切"],
["七里ヶ浜","行合橋と階段",[4,8],"咲太がかえでを背負って登ろうとする階段。通学路の橋。","行合橋 鎌倉市"],
["七里ヶ浜","七里ガ浜高校",A,"咲太たちが通う峰ヶ原高校のモデル。"],
["七里ヶ浜","セブンイレブン 鎌倉七里ヶ浜店",[1,6],"校舎の最寄りのコンビニ。咲太がお見舞いの缶詰を買う。"],
["七里ヶ浜","七里ヶ浜海岸",[0,1,7],"咲太と翔子が出会い、麻衣が母親に気づかれず、朋絵と逃げてきた海。『ランドセルガール』の冒頭にも。"],
["七里ヶ浜","Pacific DRIVE-IN 七里ヶ浜",[4,5],"かつてのファーストキッチンの跡地。ハワイアンカフェのモデル。"],
["七里ヶ浜","七里ガ浜ポンプ場",[8],"アニメのOPなどに登場。"],
["七里ヶ浜","鎌倉高校前駅",[3],"CM撮影の駅として登場。目の前に湘南の海が広がる。"],
["七里ヶ浜","稲村ヶ崎駅",[5],"翔子と咲太がハワイアンカフェから歩いて向かった駅。"],
["鎌倉・逗子・葉山","鎌倉駅西口 時計台広場",[3],"麻衣との待ち合わせ場所。","鎌倉駅 西口 時計台広場"],
["鎌倉・逗子・葉山","鶴岡八幡宮",[8],"鎌倉を巡る場面で二の鳥居などが登場。"],
["鎌倉・逗子・葉山","逗子駅",[5],"葉山の海岸へのバスが発着する駅。"],
["鎌倉・逗子・葉山","森戸海岸",[5],"翔子さんとのデートで歩いた海岸。冬は富士山を背に江の島が見える。","森戸海岸 葉山町"],
["鎌倉・逗子・葉山","森戸橋",[5],"森戸海岸にそそぐ川の橋。","森戸橋 葉山町"],
["鎌倉・逗子・葉山","SCAPES THE SUITE",[5],"海の見えるチャペルのあるリゾートホテルのモデル。","SCAPES THE SUITE 葉山"],
["鵠沼","本鵠沼駅",[2],"双葉の家の最寄り駅。住宅街が広がる。"],
["鵠沼","セブンイレブン 藤沢本鵠沼店",[2],"咲太が深夜に買い物をしたコンビニ。"],
["横浜・東京","金沢八景駅",[8],"大学生編の舞台となる駅。","金沢八景駅 横浜市"],
["横浜・東京","横浜市立大学 金沢八景キャンパス",[8],"大学生編で登場する大学。"],
["横浜・東京","新橋駅",[6],"咲太が麻衣に会いに向かう駅。"],
["横浜・東京","上野動物園",[4],"咲太がかえでと訪れる動物園。"],
["金沢・大垣","金沢駅 東口",[5],"咲太が麻衣に会いに降り立つ駅。","金沢駅 東口"],
["金沢・大垣","卯辰山 見晴らし台",[5],"咲太と麻衣が金沢の夜景を見た展望台とされる。","卯辰山 見晴らし台 金沢"],
["金沢・大垣","兼六園",[5],"咲太が見て回った金沢の観光地。"],
["金沢・大垣","ひがし茶屋街",[5],"咲太が見て回った金沢の観光地。"],
["金沢・大垣","長町武家屋敷跡",[5],"咲太が見て回った金沢の観光地。"],
["金沢・大垣","大垣駅",[0],"咲太と麻衣が向かう岐阜の駅。"]
];
var AREAS=[];S.forEach(function(s){if(AREAS.indexOf(s[0])<0)AREAS.push(s[0])});
var fa="",ft=-1,todo=false,seen={};
try{seen=JSON.parse(localStorage.getItem("aobuta_seen3")||"{}")||{}}catch(e){seen={}}
function e(x){return encodeURIComponent(x)}
function q(s){return s[4]||(s[1]+" "+(CITY[s[0]]||""))}
function tags(s){
var t=s[2],h="";
var all=A.every(function(i){return t.indexOf(i)>=0});
if(all)h+='<span class="tag">全巻(『バニーガール先輩』〜『ハツコイ少女』)</span>';
t.forEach(function(i){if(!(all&&i<7))h+='<span class="tag">『'+T[i]+'』</span>'});
return h;
}
function ch(id,arr,cur,key){
document.getElementById(id).innerHTML=arr.map(function(a){return '<button class="chip" data-k="'+key+'" data-v="'+a[0]+'" aria-pressed="'+(String(cur)===String(a[0]))+'">'+a[1]+'</button>'}).join("");
}
function chips(){
ch("ct",[[-1,"全作品"]].concat(T.map(function(x,i){return [i,"『"+x+"』"]})).concat([["todo","未訪問のみ"]]),todo?"todo":ft,"t");
ch("ca",[[ "","すべて"]].concat(AREAS.map(function(a){return [a,a]})),fa,"a");
}
function routeUrl(a){
var l=S.filter(function(s){return s[0]===a}).slice(0,11);
if(l.length<2)return "";
var w=l.slice(1,-1).map(function(s){return e(q(s))}).join("%7C");
return "https://www.google.com/maps/dir/?api=1&travelmode="+MODE[a]+"&origin="+e(q(l[0]))+"&destination="+e(q(l[l.length-1]))+(w?"&waypoints="+w:"");
}
function render(){
var n=0;S.forEach(function(s){if(seen[s[1]])n++});
document.getElementById("pt").textContent="巡礼進捗 "+n+" / "+S.length+" か所";
document.getElementById("pb").style.width=(n/S.length*100)+"%";
document.getElementById("route").innerHTML=fa?'<div class="row" style="margin:0 0 12px"><a class="btn main" target="_blank" rel="noopener" href="'+routeUrl(fa)+'">'+fa+'をGoogleマップでルート表示</a></div>':"";
var h="";
S.forEach(function(s){
if(todo&&seen[s[1]])return;
if(ft>=0&&s[2].indexOf(ft)<0)return;
if(fa&&s[0]!==fa)return;
var d=seen[s[1]];
h+='<div class="card'+(d?' done':'')+'"><div class="tags">'+tags(s)+'</div><h2>'+s[1]+'</h2><p>'+s[3]+'</p><div class="note" style="margin-top:4px">'+s[0]+'</div><div class="row"><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+e(q(s))+'">Googleマップで開く</a><button class="btn'+(d?' on':'')+'" data-n="'+s[1]+'">'+(d?'✓ 訪問済み':'行った!')+'</button></div></div>';
});
document.getElementById("list").innerHTML=h||'<p class="note">該当するスポットはありません。</p>';
}
document.addEventListener("click",function(ev){
var c=ev.target.closest(".chip");
if(c){var k=c.dataset.k,v=c.dataset.v;
if(k==="t"){if(v==="todo"){todo=!todo}else{ft=parseInt(v,10)}}else{fa=v}
chips();render();return}
var b=ev.target.closest("button[data-n]");
if(b){var id=b.dataset.n;if(seen[id])delete seen[id];else seen[id]=1;try{localStorage.setItem("aobuta_seen3",JSON.stringify(seen))}catch(x){}render();return}
if(ev.target.id==="csv"){
var t="名前,検索語,作品,説明\n"+S.map(function(s){return [s[1],q(s),s[2].map(function(i){return T[i]}).join("/"),s[3]].map(function(v){return '"'+v.replace(/"/g,'""')+'"'}).join(",")}).join("\n");
var ta=document.getElementById("ta");ta.value=t;ta.hidden=false;ta.select();
try{navigator.clipboard.writeText(t).then(function(){ev.target.textContent="コピーしました"},function(){})}catch(x){}
}
});
chips();render();
try{if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js")}}catch(x){}
</script>
</body>
</html>
